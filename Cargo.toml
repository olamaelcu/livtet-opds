[workspace]
members = ["opds", "opds-atom", "opds-server", "opds-types"]
default-members = ["opds-types", "opds"]
[workspace.package]
edition = "2024"
rust-version = "1.97.0"
[workspace.dependencies]
livtet-core = { git = "https://github.com/olamaelcu/livtet", branch = "main" }
livtet-covers = { git = "https://github.com/olamaelcu/livtet", branch = "main" }
livtet-data = { git = "https://github.com/olamaelcu/livtet", branch = "main" }
livtet-search = { git = "https://github.com/olamaelcu/livtet", branch = "main" }
livtet-test-utils = { git = "https://github.com/olamaelcu/livtet", branch = "main" }
livtet-types = { git = "https://github.com/olamaelcu/livtet", branch = "main" }
async-trait = "0.1"
base64 = "0.22"
camino = { version = "1", features = ["serde1"] }
camino-tempfile = "1"
fake = { version = "5.1.0", features = ["ulid", "time", "url"] }
fs-err = { version = "3", features = ["tokio"] }
futures-util = "0.3"
hex = "0.4"
jsonschema = { version = "0.49.2" }
miette = "7"
mutants = "0"
paste = "1"
poem = "3.1"
rand = "0.10"
rand_core = "0.10"
reqwest = { version = "0.12", default-features = false }
schemars = "1"
sea-orm = { version = "2.0", features = ["time", "macros"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
specta = { version = "2.0.0-rc.25", features = ["camino", "serde_json"] }
strum = { version = "0.26", features = ["derive"] }
thiserror = "2"
time = { version = "0.3", features = ["serde"] }
tokio = { version = "1", features = ["rt", "macros"] }
toml = { version = "1.1.4+spec-1.1.0" }
tracing = "0.1"
tracing-subscriber = "0.3"
ulid = { version = "1", features = ["serde", "std"] }
url = "2"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
mem_forget = "deny"
